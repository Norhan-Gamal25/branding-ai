# Render deployment config for Branding AI backend
services:
  - type: web
    name: branding-ai-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: IBM_API_KEY
        sync: false
      - key: IBM_PROJECT_ID
        sync: false
      - key: IBM_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: GROQ_API_KEY
        sync: false
      - key: EXPORT_DIR
        value: /tmp/exports
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: exports
      mountPath: /tmp/exports
      sizeGB: 1
